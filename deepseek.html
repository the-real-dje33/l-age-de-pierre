<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>L'Age de Pierre - CPC 464</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;}
  #wrap{display:flex;justify-content:center;align-items:center;height:100vh;background:#000;}
  canvas{image-rendering:pixelated;background:#000;}
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" width="640" height="416"></canvas></div>
<script>
/* ================================================================
   L'AGE DE PIERRE - CPC 464  ->  HTML/JS
   ================================================================ */

const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');

const PAL = {
  0: '#000000',
  1: '#00c000',
  2: '#ff0000',
  3: '#ffff00'
};

/* ---------- SYMBOL (8x8) ---------- */
const SYMBOLS = {
  255: [0xCF,0xCF,0xCF,0x00,0xF3,0xF3,0xF3,0x00],
  254: [0x7F,0xFF,0xC3,0xBF,0xBF,0xBF,0xBF,0xFF],
  253: [0xFC,0xFE,0xFE,0xFE,0xFE,0xFE,0xFE,0xFE],
  252: [0xFF,0xFF,0xFF,0xFF,0xFF,0xFF,0x7F,0x00],
  251: [0xFE,0xFE,0xFE,0xFE,0xFE,0xFE,0xFC,0x00],
  250: [0x07,0x1F,0x3F,0x7F,0x7F,0xFF,0xFF,0xFF],
  249: [0xE0,0xF8,0xFC,0xFE,0xFE,0xFF,0xFF,0xFF],
  248: [0xFF,0xFF,0xCF,0x47,0x63,0x33,0x1F,0x07],
  247: [0xFF,0xFF,0xFF,0xFE,0xFE,0xFC,0xF8,0xE0],
  246: [0x07,0x09,0x0F,0x0F,0x07,0x01,0x0F,0x17],
  245: [0xE0,0x90,0xF0,0xF0,0xE0,0x80,0xF0,0xE8],
  244: [0x33,0x31,0x33,0x26,0x0C,0x18,0x0C,0x1C],
  243: [0xCC,0x8C,0xCC,0x64,0x30,0x18,0x30,0x38]
};

// CHR$(207) : damier 1-pixel du CPC (vert/noir alterné)
const HERBE = [0xAA,0x55,0xAA,0x55,0xAA,0x55,0xAA,0x55];

const S     = 2;
const CHAR  = 8 * S;
const CELL  = CHAR * 2;

/* ---------- Dessin ---------- */
function drawBytes(bytes, px, py, color){
  ctx.fillStyle = color;
  for(let y=0;y<8;y++){
    const b = bytes[y];
    for(let x=0;x<8;x++){
      if(b & (0x80>>x)) ctx.fillRect(px + x*S, py + y*S, S, S);
    }
  }
}
function drawSymbol(code, px, py, color){
  if(SYMBOLS[code]) drawBytes(SYMBOLS[code], px, py, color);
}

function drawTile(ch, px, py){
  if(ch === 'm'){
    const c = PAL[2];
    drawSymbol(255, px,        py,        c);
    drawSymbol(255, px + CHAR, py,        c);
    drawSymbol(255, px,        py + CHAR, c);
    drawSymbol(255, px + CHAR, py + CHAR, c);
  }
  else if(ch === 'h'){
    const c = PAL[1];
    drawBytes(HERBE, px,        py,        c);
    drawBytes(HERBE, px + CHAR, py,        c);
    drawBytes(HERBE, px,        py + CHAR, c);
    drawBytes(HERBE, px + CHAR, py + CHAR, c);
  }
  else if(ch === 'r'){
    const c = PAL[3];
    drawSymbol(254, px,        py,        c);
    drawSymbol(253, px + CHAR, py,        c);
    drawSymbol(252, px,        py + CHAR, c);
    drawSymbol(251, px + CHAR, py + CHAR, c);
  }
  else if(ch === 'p'){
    const c = PAL[2];
    drawSymbol(250, px,        py,        c);
    drawSymbol(249, px + CHAR, py,        c);
    drawSymbol(248, px,        py + CHAR, c);
    drawSymbol(247, px + CHAR, py + CHAR, c);
  }
}

/* ---------- Salles ---------- */
const ROOMS = [
  { map:[
    "mmmmmmmmmmmmmmmmmmmm",
    "m hrhhmmmmrrrmrmmmrm",
    "mhhhmpr mhhhhmp  hrm",
    "mrrhmmp mp  h   m rm",
    "mpphhhh mmm hmmrrhrm",
    "mhhhhhh rhmphmphhhrm",
    "mhmmmmmmrhmrrrrrrhrm",
    "mhmhhhhhmmmmmmmmmhrm",
    "mhmhphphprrrrrrrrhrm",
    "mhr  hhhhphphphphhrm",
    "mhrhphphprrrrrrrrrrm",
    "mmmmmmmmmmmmmmmmmmmm"
  ], pom:18, tps:150, x:2, y:2 },
  { map:[
    "mmmmmmmmmmmmmmmmmmmm",
    "mrrmmmmmmmmmrrrrmrrm",
    "m hmmmmmmmmmmmmhrprm",
    "m hmmp p p  pppppprm",
    "m hmm p p mmrrrhrprm",
    "m hmmp p pmmrmmmrprm",
    "mhhmmmmmmmmmrppmrprm",
    "m hmmmmmmmmmmhrrmprm",
    "mhhrrrhhhr  hhhhhprm",
    "m hhhhhhhhmmrrrrrrrm",
    "mhhrrrrrrrmmmmmmmmmm",
    "mmmmmmmmmmmmmmmmmmmm"
  ], pom:22, tps:80, x:2, y:3 },
  { map:[
    "mmmmmmmmmmmmmmmmmmmm",
    "mm r  hr r mrmmr  rm",
    "mmmpmmhhmh mprhhhhhm",
    "m hhhhhrhr hhhmmm  m",
    "mmmpmmhrhr mmmmrrm m",
    "mm r  hrhr hhhhhhhpm",
    "m hhhhhrhr mmmmmmmmm",
    "mm r  hrhr rrrrrrrrm",
    "mmmpmmhrhr hhhhhhhpm",
    "mphhhhhrhr mmmmmmmmm",
    "mrrrrrhrhr hhhhhhhpm",
    "mmmmmmmmmm mmmmmmmmm"
  ], pom:8, tps:150, x:2, y:4 },
  { map:[
    "mmmmmmmmmmmmmmmmmmmm",
    "m hhhhhhrrrhhhhhhhhm",
    "mhhhhhhhhhprmmmmmmhm",
    "mphhhhhhrrhprmmmmmhm",
    "mrphhhhhmmrhprmmmhhm",
    "mrrphhhhhhmrhprmhphm",
    "mrrrphhhpphmrhprmhhm",
    "mrrrrphhmmphmrhprmmm",
    "mrrrrrphppmphmrhprmm",
    "mrrrrrrphhpmphmrhprm",
    "mrrrrrrrmmhpmphhr hm",
    "mmmmmmmmmmmmmmmmmmmm"
  ], pom:26, tps:80, x:2, y:2 }
];

/* ---------- État ---------- */
const state = {
  room:0,
  ecr:0,
  map:[], pom:0, tps:0,
  x:2, y:2, sc:0,
  gameOver:false, win:false,
  transitioning:false,
  demo:false
};

/* ================================================================
   AUDIO — Émulation AY-3-8912 (CPC : clock 1 MHz, prescaler 16)
   ----------------------------------------------------------------
   Formule : fréquence (Hz) = 1000000 / (16 × tone_period)
                            = 62500 / tone_period
   
   Exemples issus du BASIC :
     SOUND 129,50,100,7,1  -> tone=50  -> 1250 Hz (bip aigu court)
     SOUND 130,200,100,7,1,2,5 -> tone=200 -> 312 Hz + bruit
     SOUND 1,i*100,10,...  -> i*100 -> de 625 Hz à 62,5 Hz
     SOUND 2,1000-i*100,10,7 -> 1000-i*100 -> de 69 Hz à (très aigu)
   
   Enveloppe matérielle (ENV 1,127,-100,20) :
     - start = 127 (volume max)
     - step  = -100 par tick
     - 1 tick = 1/100 sec = 10 ms
     - volume : 127 -> 27 -> 0 en 20 ms
   Donc chaque son est un "tac" très bref, pas une note tenue.
   ================================================================ */
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
}

// AY tone period -> fréquence Hz (formule exacte CPC)
function tpToFreq(tp){
  if(tp <= 0) return 40000; // silencieux/inaudible
  return 62500 / tp;
}

// Volume AY 0-15 -> gain linéaire approximatif (courbe logarithmique réaliste)
const VOL_TABLE = [
  0.000, 0.0015, 0.003, 0.005, 0.008, 0.012, 0.018, 0.026,
  0.038, 0.055, 0.080, 0.115, 0.165, 0.235, 0.340, 0.500
];
function ayGain(v){
  if(v < 0) v = 0;
  if(v > 15) v = 15;
  return VOL_TABLE[Math.round(v)];
}

/* --- Primitive : joue un ton carré + optionnel bruit AY,
       avec une enveloppe percussive (attaque 2 ms, decay rapide) --- */
function ayTone(tp, durMs, vol, noisePeriod){
  ensureAudio();
  const now = audioCtx.currentTime;
  const dur = durMs / 1000;

  // Canal tonal
  const osc = audioCtx.createOscillator();
  osc.type = 'square';
  osc.frequency.value = tpToFreq(tp);

  const g = audioCtx.createGain();
  const peak = ayGain(vol);
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(peak, now + 0.002);   // attaque 2 ms
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur); // decay rapide

  osc.connect(g).connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + dur + 0.02);

  // Canal bruit (si demandé)
  if(noisePeriod !== undefined && noisePeriod > 0){
    const nDur = dur;
    const buf = audioCtx.createBuffer(1, Math.max(1, Math.floor(audioCtx.sampleRate * nDur)), audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    // Bruit filtré selon le noise period (période basse = bruit plus aigu)
    const nf = tpToFreq(noisePeriod);
    const periodSamples = Math.max(1, Math.round(audioCtx.sampleRate / nf));
    let seed = 12345;
    let counter = 0, sample = 0;
    for(let i=0;i<data.length;i++){
      if(counter <= 0){
        seed = (seed * 1103515245 + 12345) & 0x7fffffff;
        sample = (seed / 0x7fffffff) * 2 - 1;
        counter = periodSamples;
      }
      data[i] = sample;
      counter--;
    }
    const nSrc = audioCtx.createBufferSource();
    nSrc.buffer = buf;
    const nG = audioCtx.createGain();
    const nPeak = ayGain(Math.min(vol, 10)) * 0.35;
    nG.gain.setValueAtTime(0, now);
    nG.gain.linearRampToValueAtTime(nPeak, now + 0.002);
    nG.gain.exponentialRampToValueAtTime(0.0001, now + nDur);
    nSrc.connect(nG).connect(audioCtx.destination);
    nSrc.start(now);
    nSrc.stop(now + nDur + 0.02);
  }
}

/* ============================================================
   SONS DU JEU (traduction fidèle des SOUND du BASIC)
   ============================================================ */

// Manger une pomme (ligne 1270) : SOUND 129,50,100,7,1
//   tone=50 -> 1250 Hz, envelope 1 = 20 ms effectif, volume 7
function playEat(){
  ayTone(50, 0.028, 7);   // 28 ms : court et percussif
}

// Clac de pierre / impact de mort (lignes 1290 et 1570) :
//   SOUND 130,200,100,7,1,2,5 -> tone=200 (312 Hz) + noise period 2
function playRockStop(){
  ayTone(200, 0.060, 7, 2);
}

// Mélodie de mort (ligne 1570) :
//   FOR i=1 TO 10
//     SOUND 1,i*100,10,INT(i/3)  -> sweep tonal descendant
//     SOUND 2,1000-i*100,10,7    -> sweep tonal montant (canal 2)
//   NEXT
//   Chaque itération dure 100 ms (durée 10 * 10ms, non affectée par l'enveloppe)
function playLose(){
  ensureAudio();
  for(let i = 1; i <= 10; i++){
    const tone1 = i * 100;                        // 100..1000
    const tone2 = Math.max(1, 1000 - i * 100);    // 900..1
    const vol1  = Math.floor(i / 3);              // 0,0,1,1,1,2,2,2,3,3
    const delay = (i - 1) * 100;                  // 100 ms entre itérations

    setTimeout(() => {
      if(vol1 > 0) ayTone(tone1, 0.100, vol1);
      ayTone(tone2, 0.100, 7);
    }, delay);
  }
}

// Séquence complète de mort (impact + pause + mélodie), comme lignes 1570
function playDeathSequence(){
  playRockStop();              // SOUND 130,200,... (impact)
  setTimeout(()=>playLose(), 250); // FOR i=1 TO 1000 : NEXT ~ 200 ms
}

/* ---------- Rendu ---------- */
function renderRoom(){
  ctx.fillStyle = PAL[0];
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for(let row=0; row<12; row++){
    const line = state.map[row] || "";
    for(let col=0; col<20; col++){
      drawTile(line[col] || ' ', col*CELL, row*CELL);
    }
  }
  drawMonster();
  drawHUD();
}

function drawMonster(){
  const px = (state.x-1)*CELL;
  const py = (state.y-1)*CELL;
  const c  = PAL[3];
  drawSymbol(246, px,        py,        c);
  drawSymbol(245, px + CHAR, py,        c);
  drawSymbol(244, px,        py + CHAR, c);
  drawSymbol(243, px + CHAR, py + CHAR, c);
}

function drawHUD(){
  ctx.fillStyle = PAL[3];
  ctx.font = 'bold 20px monospace';
  ctx.textBaseline = 'top';
  const y = 12*CELL + 4;
  ctx.fillText('SCORE:',   16,  y);
  ctx.fillText(String(state.sc).padStart(4,' '), 110, y);
  ctx.fillText('ENERGIE:', 240, y);
  ctx.fillText(String(state.tps).padStart(3,' '), 360, y);
  ctx.fillText('POMMES:',  470, y);
  ctx.fillText(String(state.pom).padStart(2,' '), 580, y);
}

/* ---------- Logique ---------- */
function loadRoom(idx){
  const r = ROOMS[idx];
  state.map = r.map.slice();
  state.pom = r.pom;
  state.tps = r.tps;
  state.x = r.x;
  state.y = r.y;
}

function getCell(x,y){
  if(y<1||y>12||x<1||x>20) return 'm';
  return (state.map[y-1]||'')[x-1] || ' ';
}
function setCell(x,y,ch){
  if(y<1||y>12||x<1||x>20) return;
  let line = state.map[y-1] || "";
  state.map[y-1] = line.substring(0,x-1) + ch + line.substring(x);
}

function nextRoomOrWin(){
  if(state.transitioning) return;
  state.transitioning = true;
  state.ecr++;

  if(state.ecr >= 4){
    setTimeout(()=>{
      state.transitioning = false;
      win();
    }, 300);
    return;
  }

  ctx.fillStyle = PAL[0];
  ctx.fillRect(0,0,canvas.width,canvas.height);

  setTimeout(()=>{
    state.room++;
    if(state.room >= 4) state.room = 3;
    loadRoom(state.room);
    state.transitioning = false;
    renderRoom();
  }, 400);
}

/* Fait tomber une pierre située en (rx, ry) tant qu'elle a de la place en dessous.
   Émule la routine 1280-1330 du BASIC. */
function rockFalls(rx, ry){
  while(getCell(rx, ry + 1) === ' '){
    setCell(rx, ry, ' ');
    ry++;
    setCell(rx, ry, 'r');
    // Si la pierre atteint le joueur -> mort (BASIC ligne 1320 -> 1570)
    if(rx === state.x && ry === state.y){
      renderRoom();
      playDeathSequence();   // impact + mélodie de mort
      lose();
      return true;
    }
  }
  // La pierre s'arrête : son "clac" (BASIC ligne 1290)
  playRockStop();
  return false;
}

function moveMonster(dx,dy){
  if(state.gameOver || state.win || state.transitioning || state.demo) return;

  state.tps--;
  if(state.tps <= 0){ renderRoom(); lose(); return; }

  const oldX = state.x, oldY = state.y;
  const hasRockAbove = (dy !== -1) && (getCell(oldX, oldY - 1) === 'r');
  const nx = oldX + dx, ny = oldY + dy;
  const target = getCell(nx, ny);
  let moved = false;
  let pushedRockX = -1, pushedRockY = -1;

  if(target === ' '){
    state.x = nx; state.y = ny; moved = true;
  }
  else if(target === 'h'){
    state.x = nx; state.y = ny;
    setCell(nx, ny, ' ');
    moved = true;
  }
  else if(target === 'p'){
    state.x = nx; state.y = ny;
    setCell(nx, ny, ' ');
    moved = true;
    state.sc += 150;
    playEat();
    state.pom--;
  }
  else if(target === 'r'){
    if(dx !== 0){
      const bx = nx + dx;
      if(getCell(bx, ny) === ' '){
        setCell(bx, ny, 'r');
        setCell(nx, ny, ' ');
        state.x = nx; state.y = ny;
        moved = true;
        pushedRockX = bx;
        pushedRockY = ny;
      }
    }
  }

  // Priorité : pierre au-dessus qui tombe (BASIC ligne 1340/1350 GOSUB 1280)
  if(moved && hasRockAbove){
    if(rockFalls(oldX, oldY - 1)) return;
  }
  // Sinon : la pierre poussée tombe (BASIC 1340/1350 GOTO 1280)
  else if(moved && pushedRockX >= 0){
    if(rockFalls(pushedRockX, pushedRockY)) return;
  }

  renderRoom();

  if(state.pom <= 0){
    nextRoomOrWin();
  }
}

function lose(){
  state.gameOver = true;
  // playDeathSequence() a déjà été appelé par rockFalls() ou par
  // la fin d'énergie. Si c'est l'énergie, jouer la séquence ici.
  if(state.tps <= 0 && !state.rockKilled){
    playDeathSequence();
  }
  ctx.fillStyle = PAL[0];
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = PAL[3];
  ctx.font = 'bold 28px monospace';
  ctx.fillText('Vous avez perdu !!!', 130, 200);
  setTimeout(restart, 2500);
}

function win(){
  state.win = true;
  ctx.fillStyle = PAL[0];
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = PAL[3];
  ctx.font = 'bold 24px monospace';
  ctx.fillText('* VOUS AVEZ GAGNE *', 130, 100);
  ctx.font = '16px monospace';
  ctx.fillText('Vous etes le premier qui ait reussi cet exploit.', 60, 160);
  ctx.fillText('Nous nous souviendrons de vous comme etant', 60, 185);
  ctx.fillText("LE SEUL hero de l'histoire !", 60, 210);
  ctx.fillText('Votre score: ' + state.sc, 60, 250);
  ctx.fillText('Une touche pour rejouer...', 60, 300);
  setTimeout(restart, 5000);
}

function restart(){
  state.room = 0;
  state.ecr  = 0;
  state.sc   = 0;
  state.gameOver = false;
  state.win = false;
  state.transitioning = false;
  state.demo = false;
  state.rockKilled = false;
  loadRoom(0);
  renderRoom();
}

/* ---------- Clavier ---------- */
document.addEventListener('keydown', e=>{
  ensureAudio();
  if(state.gameOver || state.win || state.transitioning || state.demo) return;

  if(e.key==='ArrowUp'){         e.preventDefault(); moveMonster(0,-1); }
  else if(e.key==='ArrowDown'){  e.preventDefault(); moveMonster(0,1);  }
  else if(e.key==='ArrowLeft'){  e.preventDefault(); moveMonster(-1,0); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); moveMonster(1,0);  }
  else if(e.key==='d' || e.key==='D'){
    state.demo = true;
    state.transitioning = true;
    let z = 0;
    function demoNext(){
      if(z >= 4){
        state.demo = false;
        state.transitioning = false;
        restart();
        return;
      }
      loadRoom(z);
      renderRoom();
      z++;
      setTimeout(demoNext, 600);
    }
    demoNext();
  }
});

/* ---------- Démarrage ---------- */
loadRoom(0);
renderRoom();

setTimeout(()=>{
  ctx.fillStyle = PAL[0];
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = PAL[3];
  ctx.font = 'bold 24px monospace';
  ctx.fillText("L'AGE DE PIERRE", 190, 60);
  ctx.font = '14px monospace';
  ctx.fillText("LE BUT DU JEU: Vous devez au travers de 4 salles guider", 40, 130);
  ctx.fillText("un personnage dont la seule raison d'etre est de ramasser", 40, 152);
  ctx.fillText("les fruits rouges tapissant le sol.", 40, 174);
  ctx.fillText("DEROULEMENT: Fleches du curseur. Chaque deplacement", 40, 214);
  ctx.fillText("coute 1 point d'energie. Si energie = 0, vous mourez.", 40, 236);
  ctx.fillText("Les pierres tombent si vous passez dessous.", 40, 266);
  ctx.fillText("Vous pouvez pousser une pierre s'il y a de la place.", 40, 288);
  ctx.fillText("Terminez les 4 salles pour gagner !", 40, 328);
  setTimeout(renderRoom, 3500);
}, 100);
</script>
</body>
</html>
